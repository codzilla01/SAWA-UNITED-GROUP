name: Build & Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & deploy public_html to sawa-united.net
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER || vars.HOSTINGER_FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME || vars.HOSTINGER_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
      FTP_SERVER_DIR: ${{ secrets.HOSTINGER_FTP_SERVER_DIR || vars.HOSTINGER_FTP_SERVER_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build & package Hostinger public_html archive
        run: npm run build:hostinger

      - name: Upload sawa-united-public_html.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: sawa-united-public_html
          path: sawa-united-public_html.zip
          include-hidden-files: true
          retention-days: 30

      - name: Deploy dist/ to Hostinger via FTP
        if: env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: ${{ env.FTP_SERVER_DIR != '' && env.FTP_SERVER_DIR || './' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            config.php
            **/config.php
            .well-known/**
            **/.well-known/**
            cgi-bin/**
            **/cgi-bin/**

      - name: Skip notice when Hostinger FTP secrets are not set
        if: env.FTP_SERVER == '' || env.FTP_USERNAME == '' || env.FTP_PASSWORD == ''
        run: |
          echo "::notice::Built sawa-united-public_html.zip artifact. Add HOSTINGER_FTP_SERVER, HOSTINGER_FTP_USERNAME, and HOSTINGER_FTP_PASSWORD in GitHub Actions Secrets to enable automatic deployment to Hostinger."
