name: Build Hostinger Package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build public_html bundle for sawa-united.net
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build & package Hostinger public_html archive
        run: npm run build:hostinger

      - name: Upload sawa-united-public_html.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: sawa-united-public_html
          path: sawa-united-public_html.zip
          include-hidden-files: true
          retention-days: 30
